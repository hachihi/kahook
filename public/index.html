<!doctype html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QuizBlast</title>
<meta name="description" content="QuizBlast - Đố vui, thi đua, bứt phá. Trò chơi trắc nghiệm tương tác thời gian thực.">
<meta property="og:title" content="QuizBlast">
<meta property="og:description" content="QuizBlast - Đố vui, thi đua, bứt phá. Trò chơi trắc nghiệm tương tác thời gian thực.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800;900&family=Bangers&family=Be+Vietnam+Pro:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,700&family=Dancing+Script:wght@600;700&family=Lobster&family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,700&family=Oswald:wght@400;600;700&family=Pacifico&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{--p:#46178f;--p-dark:#2a0b63;--y:#ffd602;--pink:#ff4d8d;--teal:#26d0ce;--bg:#1d0a45}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{margin:0;font-family:"Nunito","Segoe UI",system-ui,sans-serif;font-weight:600;background:radial-gradient(1200px 600px at 50% -10%,#7b2ff7aa,transparent),linear-gradient(160deg,#2b0a5e,#46178f 55%,#1d0a45);background-attachment:fixed;color:#fff;min-height:100vh;display:flex;justify-content:center;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(75px);opacity:.35;pointer-events:none;will-change:transform}
body::before{width:450px;height:450px;background:var(--pink);left:-150px;top:6%;animation:float 14s ease-in-out infinite}
body::after{width:500px;height:500px;background:var(--teal);right:-180px;bottom:-100px;animation:float 18s ease-in-out infinite reverse}
@keyframes float{50%{transform:translate(35px,-45px) scale(1.1)}}
h1,h2,h3,.big,.pin,.logo,button,.brand .bt,.pod .nm,.plb-name,.pfc-name,.pfc-badge,.pr-title{font-family:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif}
#wrap{width:100%;max-width:760px;min-height:100vh;display:flex;flex-direction:column}
main{width:100%;max-width:760px;padding:20px 16px;text-align:center;margin:0 auto;flex:1}
h1{font-size:clamp(1.9rem,6vw,2.5rem);font-weight:900;letter-spacing:.3px;margin:.5em 0;text-shadow:0 3px 0 #0004}
h2{margin:18px 0 8px;font-size:clamp(1.4rem,4.5vw,1.8rem);font-weight:800}

/* Logo & Tiêu đề */
.logo{font-size:clamp(2.4rem,10vw,3.8rem);font-weight:900;margin:.4em 0 0;letter-spacing:1px;text-shadow:0 4px 0 #0005}
.logo span{color:var(--y)}.logo .bolt{display:inline-block;animation:zap 2.4s ease-in-out infinite}
@keyframes zap{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.18)}}
.sub{font-size:clamp(1.05rem,3.8vw,1.3rem);opacity:.95;margin:0 0 16px;font-weight:700;letter-spacing:.4px}
.emoji{font-size:clamp(3.8rem,12vw,4.8rem);line-height:1;margin-top:20px;animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.45}}

/* Form & Thẻ */
.card{background:#fffffff5;color:#222;border-radius:22px;padding:22px 18px;margin:14px 0;text-align:left;box-shadow:0 10px 0 #0003,0 16px 36px #0004;text-shadow:none}
.card>b{display:block;font-family:"Baloo 2",sans-serif;font-size:1.18rem;color:var(--p);margin:12px 0 4px}.card>b:first-child{margin-top:0}
input,textarea,select{width:100%;padding:14px 16px;margin:8px 0;border:2px solid #e3dcf3;background:#faf8ff;border-radius:14px;font-size:1.12rem;font-family:inherit;font-weight:700;color:#222;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:#7b2ff7;background:#fff;box-shadow:0 0 0 4px rgba(123,47,247,0.22)}
input[type=range]{padding:0}

/* Nút bấm tổng thể */
button{background:linear-gradient(#2a7de1,#1368ce);color:#fff;border:0;border-radius:16px;padding:15px 20px;font-size:1.15rem;font-weight:800;cursor:pointer;margin:8px 0;width:100%;box-shadow:0 5px 0 #0003;transition:transform .08s,filter .15s,box-shadow .15s;touch-action:manipulation;min-height:52px}
button:hover:not(:disabled){filter:brightness(1.08)}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #0003}
button:disabled{opacity:.55;cursor:not-allowed}
button.cta{background:linear-gradient(#ffe24d,#ffc400);color:#3a1670;font-size:clamp(1.22rem,4.4vw,1.4rem);box-shadow:0 6px 0 #c79500,0 8px 22px rgba(255,214,2,0.35);font-weight:900}
button.ghost{background:#ffffff1c;border:2px solid rgba(255,255,255,0.45);backdrop-filter:blur(6px);box-shadow:none}
button.ghost:active:not(:disabled){box-shadow:none}
button.sm{width:auto;padding:8px 16px;font-size:1rem;min-height:40px}

/* Giao diện Đăng nhập / Vào chơi */
.player-join-card{padding:26px 20px}
.input-lbl{display:block;font-family:"Baloo 2",sans-serif;font-size:1.05rem;font-weight:900;color:var(--p);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.6px}
.input-wrap:first-child .input-lbl{margin-top:0}
#pin{font-size:clamp(2.1rem,8.5vw,2.9rem);text-align:center;letter-spacing:.25em;font-weight:900;color:var(--p);padding:14px 16px;min-height:64px;border:2.5px solid #d5c8f2}
#nm{font-size:1.25rem;font-weight:700;text-align:center;padding:15px 16px;min-height:58px;border:2.5px solid #d5c8f2}
.join-cta-btn{min-height:62px;margin-top:12px;font-size:1.35rem;border-radius:18px}
.host-portal-btn{margin-top:14px;font-size:1.05rem}

/* Màn hình Chờ của Người chơi (Lobby) */
.player-lobby-box{background:rgba(255,255,255,0.16);border:2px solid rgba(255,255,255,0.35);backdrop-filter:blur(12px);border-radius:26px;padding:30px 20px;margin-top:18px;box-shadow:0 18px 40px rgba(0,0,0,0.3);animation:pop .4s ease-out both}
.plb-badge{display:inline-block;background:var(--y);color:#3a1670;font-family:"Baloo 2",sans-serif;font-weight:900;font-size:1.05rem;padding:6px 18px;border-radius:30px;letter-spacing:.6px;box-shadow:0 4px 14px rgba(255,214,2,0.4)}
.plb-welcome{font-size:clamp(1.8rem,6.5vw,2.5rem);font-weight:900;margin:16px 0 10px;line-height:1.25}
.plb-name{color:var(--y);text-shadow:0 0 16px rgba(255,214,2,0.7);text-decoration:underline;text-underline-offset:5px}
.plb-pin-card{background:rgba(0,0,0,0.36);border:1px solid rgba(255,255,255,0.22);border-radius:18px;padding:14px 18px;margin:20px auto;max-width:280px}
.plb-pin-lbl{font-size:.88rem;letter-spacing:1.5px;font-weight:800;opacity:.88}
.plb-pin-val{font-size:2.5rem;font-weight:900;letter-spacing:.22em;color:#fff;font-family:"Baloo 2",monospace;margin-top:2px}
.plb-status{display:flex;align-items:center;justify-content:center;gap:10px;font-size:1.22rem;font-weight:800;color:#69f0ae;margin-top:14px}
.plb-dot{width:13px;height:13px;background:#69f0ae;border-radius:50%;box-shadow:0 0 14px #69f0ae;animation:pulse 1.5s infinite}
.plb-tip{margin-top:20px;font-size:1.15rem;opacity:.92;font-weight:700;line-height:1.45}

/* Màn hình Câu hỏi (Question Screen) */
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.pill{background:rgba(0,0,0,0.42);border:1.5px solid rgba(255,255,255,0.25);border-radius:30px;padding:8px 18px;font-weight:800;font-size:clamp(1.05rem,3.8vw,1.25rem);backdrop-filter:blur(6px)}
.pill.t{background:var(--y);color:#3a1670;border-color:#ffe866;min-width:88px;text-align:center;font-size:clamp(1.22rem,4.4vw,1.5rem);box-shadow:0 4px 14px rgba(255,214,2,0.4)}
.tbar{height:14px;background:rgba(0,0,0,0.38);border-radius:10px;overflow:hidden;margin:10px 0 14px;box-shadow:0 2px 5px rgba(0,0,0,0.25) inset}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,#26d07c,#ffd602 60%,#e21b3c);transition:width .5s linear;border-radius:10px}
.qcard{background:#fff;color:#22084c;border-radius:22px;padding:22px 18px;margin:14px 0;font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;font-size:clamp(1.4rem,5.5vw,2.15rem);line-height:1.32;box-shadow:0 8px 0 rgba(0,0,0,0.18),0 16px 36px rgba(0,0,0,0.25);text-shadow:none;animation:pop .35s ease-out both}

/* ===== Banner thiết kế được (kéo thả) + trình chỉnh sửa ===== */
.brand.dz{display:block;position:relative;padding:0;overflow:hidden;gap:0;text-align:left;--u:3px}
.brand.dz .bel{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;line-height:1.12;margin:0;text-align:center;text-shadow:0 2px 4px #0005;pointer-events:none}
.brand.dz img.bel{height:auto;max-width:none;max-height:none;object-fit:contain;text-shadow:none}
.brand.dz .bel.ph{opacity:.45;font-style:italic}
.brand.dz.ed .bel{pointer-events:auto;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;outline:2px dashed transparent;outline-offset:4px;border-radius:4px}
.brand.dz.ed .bel:hover{outline-color:#ffffff99}
.brand.dz.ed .bel.sel{outline:2px solid var(--y)}
.brand.dz.ed .bel[contenteditable=true]{cursor:text;user-select:text;-webkit-user-select:text;outline:2px solid var(--teal);background:#0006}
.brand.dz .guide{position:absolute;background:var(--teal);pointer-events:none;opacity:0;transition:opacity .1s}
.brand.dz .guide.v{left:50%;top:0;bottom:0;width:1px}.brand.dz .guide.h{top:50%;left:0;right:0;height:1px}
.dzov{position:fixed;inset:0;z-index:15;background:linear-gradient(160deg,#2b0a5e,#46178f 55%,#1d0a45);background-size:cover;background-position:center;color:#fff;display:flex;flex-direction:column;text-align:left}
.dz-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:#0009;backdrop-filter:blur(6px);z-index:2}
.dz-top button,.dz-panel button{width:auto;margin:0;padding:8px 14px;font-size:.95rem;box-shadow:none;border-radius:10px;background:#ffffff22;border:1px solid #ffffff44;color:#fff;font-weight:800;cursor:pointer}
.dz-top button.on,.dz-panel button.on{background:var(--y);color:#3a1670;border-color:var(--y)}
.dz-seg{display:flex;gap:6px}.dz-hint{flex:1;opacity:.8;font-size:.88rem;min-width:200px}.dz-act{display:flex;gap:8px;flex-wrap:wrap}
#dzSave{background:#26c45a;border-color:#26c45a}
.dz-stage{flex:1;overflow:auto;padding:14px 10px 24px;display:flex;justify-content:center;align-items:flex-start}
.dz-frame.host{width:min(980px,100%);text-align:center}
.dz-frame.host main{padding:20px;max-width:none;text-align:center}
.dz-frame.phone{width:410px;max-width:100%;border:10px solid #15102b;border-radius:36px;overflow:hidden;box-shadow:0 12px 40px #000a;text-align:center}
.dz-frame.phone .brand{margin:8px 10px 0}
.dz-if{display:block;width:100%;height:560px;border:0;background:transparent;pointer-events:none}
.dz-panel{background:#150a35;border-top:2px solid #ffffff33;padding:10px 14px calc(12px + env(safe-area-inset-bottom));max-height:42vh;overflow:auto;z-index:2}
.dz-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.dz-ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 14px}
.dz-ctl label{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:800;opacity:.95}
.dz-ctl label.w2{grid-column:span 2}
.dz-ctl input,.dz-ctl select{margin:0;padding:8px 10px;font-size:.95rem;border-radius:10px;border:2px solid #ffffff33;background:#ffffff14;color:#fff;width:100%}
.dz-ctl select option{color:#222}
.dz-ctl input[type=color]{padding:2px;height:38px;width:60px;flex:none;cursor:pointer}
.dz-ctl input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--y);height:28px}
.dz-ctl .rw{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dz-ctl .rw input[type=range]{flex:1;min-width:90px}
.dz-ctl b{color:var(--y)}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #fff;cursor:pointer;display:inline-block;flex:none}
@media(max-width:640px){.dz-ctl label.w2{grid-column:auto}.dz-hint{display:none}.dz-panel{max-height:48vh}}

/* ===== Người chơi trên điện thoại: câu hỏi (trên) tách hẳn khay đáp án (dưới) ===== */
.pq{display:flex;flex-direction:column;gap:10px;text-align:center;margin-bottom:-20px}
.pq-top .meta .pill{font-size:1.2rem;padding:6px 18px}
.pq-top .tbar{height:14px;margin:8px 0 0}
.pq-q{flex:1 1 0;min-height:120px;display:flex}
.pq-q .qcard{flex:1;margin:0;display:flex;align-items:center;justify-content:center;box-sizing:border-box;overflow:auto;padding:16px 14px;font-size:clamp(1.7rem,7.2vw,2.6rem);line-height:1.28;text-align:center}
.pq-sheet{flex:0 0 auto;background:#0000005c;border-radius:26px 26px 0 0;padding:12px 12px calc(14px + env(safe-area-inset-bottom,0px));margin:0 -20px;box-shadow:0 -8px 26px #0006}
@media(max-width:480px){.pq{margin-bottom:-12px}.pq-sheet{margin:0 -12px}}
.pq-hint{font-weight:800;font-size:1.05rem;opacity:.92;margin:0 0 8px}
.pq-grid{display:grid;grid-template-columns:1fr;gap:10px}
.pq-grid .ans-btn{display:flex;align-items:center;gap:12px;width:100%;height:auto;margin:0;min-height:clamp(68px,10.5vh,110px);padding:10px 14px;font-size:clamp(1.2rem,5.4vw,1.6rem);line-height:1.2;font-weight:800;text-align:left;color:#fff;border:0;border-radius:18px;box-shadow:0 5px 0 #0004;background-image:linear-gradient(#ffffff2e,#00000026);text-shadow:0 2px 3px #0006;transition:transform .08s ease,filter .12s,box-shadow .12s}
.pq-grid .ans-btn .sy{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:#ffffff38;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.pq-grid .ans-btn .tx{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.pq-grid .ans-btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #0004}
.pq-grid .ans-btn:disabled{opacity:.7}
.pq-grid .ans-btn.selected{outline:4px solid #ffd602;box-shadow:0 0 24px rgba(255,214,2,0.85),0 5px 0 #0004!important;transform:translateY(-2px) scale(1.02)}
.pq-grid .ans-btn.dimmed{opacity:.35;filter:grayscale(40%)}
@media(min-width:700px),(orientation:landscape) and (min-width:560px){.pq-grid{grid-template-columns:1fr 1fr}}

/* ===== Lưới màn hình chiếu của Host ===== */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.grid .panel{display:flex!important;align-items:center!important;justify-content:flex-start!important;gap:12px;min-height:98px;height:auto;padding:14px 16px;border-radius:18px;border:0;box-shadow:0 6px 0 rgba(0,0,0,0.25);text-align:left;word-break:break-word;background-image:linear-gradient(#ffffff2e,#00000026)!important;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,0.35)}
.ans-sym{font-size:1.65rem;width:42px;height:42px;min-width:42px;display:inline-flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.22);border-radius:12px;line-height:1;text-shadow:0 2px 4px rgba(0,0,0,0.45);flex-shrink:0}
.ans-txt{flex:1;font-size:clamp(1.12rem,4.2vw,1.38rem);font-weight:800;line-height:1.25}
.ans-sym-inline{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;font-size:1.1rem;color:#fff;margin-right:6px}

/* Màn hình Đã gửi câu trả lời */
.player-sent-box{background:rgba(255,255,255,0.16);border:2px solid rgba(255,255,255,0.35);backdrop-filter:blur(12px);border-radius:26px;padding:36px 20px;margin-top:24px;box-shadow:0 18px 40px rgba(0,0,0,0.3);animation:pop .35s ease-out both}
.sent-icon{font-size:5rem;line-height:1;margin-bottom:12px;animation:bounce 1.2s infinite}
.sent-title{font-size:clamp(2rem,7.5vw,2.8rem);font-weight:900;margin:0 0 10px;letter-spacing:.5px}
.sent-pulse{font-size:1.35rem;font-weight:800;color:var(--y);margin-top:10px}
.sent-tip{margin-top:18px;font-size:1.15rem;opacity:.92;font-weight:700}

/* Màn hình Kết quả sau câu hỏi (Result / Reveal) */
.player-result-panel{border-radius:24px;padding:26px 20px;margin-top:16px;box-shadow:0 10px 0 rgba(0,0,0,0.25),0 18px 40px rgba(0,0,0,0.3)}
.pr-emoji{font-size:4.2rem;line-height:1;margin-bottom:8px}
.pr-title{font-size:clamp(2.2rem,7.8vw,3rem);font-weight:900;margin:0 0 6px;letter-spacing:.5px}
.pr-points{font-size:clamp(2.3rem,8vw,3.2rem);font-weight:900;letter-spacing:.5px}
.pr-pts-lbl{font-size:1.4rem;font-weight:800;opacity:.9}
.pr-correct-box{background:rgba(0,0,0,0.32);border-radius:14px;padding:12px 16px;margin-top:14px;font-size:1.22rem;line-height:1.35;font-weight:700;border:1px solid rgba(255,255,255,0.2)}
.pr-correct-box b{color:#ffd602;font-weight:900}
.leader-banner{background:linear-gradient(#ffd602,#e0ad00);color:#320f66;font-family:"Baloo 2",sans-serif;font-weight:900;font-size:1.25rem;padding:8px 22px;border-radius:30px;display:inline-block;margin:10px auto;box-shadow:0 0 24px rgba(255,214,2,0.85)}

.player-score-strip{display:flex;align-items:center;justify-content:space-around;background:rgba(255,255,255,0.16);border:1.5px solid rgba(255,255,255,0.32);backdrop-filter:blur(8px);border-radius:20px;padding:14px 20px;margin:16px 0;box-shadow:0 6px 18px rgba(0,0,0,0.2)}
.pss-col{display:flex;flex-direction:column;align-items:center}
.pss-lbl{font-size:.88rem;font-weight:900;letter-spacing:1.2px;opacity:.9}
.pss-val{font-size:clamp(1.7rem,5.5vw,2.3rem);font-weight:900;font-family:"Baloo 2",sans-serif;line-height:1.1;margin-top:2px}
.pss-val.rank{color:#ffd602}
.pss-total{font-size:1.15rem;opacity:.82;font-weight:700}
.pss-divider{width:2px;height:44px;background:rgba(255,255,255,0.25)}

.next-q-ticker{font-size:1.28rem;font-weight:800;color:var(--y);background:rgba(0,0,0,0.36);border-radius:30px;padding:8px 20px;display:inline-block;margin:10px 0 16px;border:1.5px solid rgba(255,214,2,0.45)}
.board-heading{font-size:clamp(1.5rem,5vw,1.9rem);font-weight:900;margin:18px 0 10px;letter-spacing:.5px}

/* Bục Vinh Quang & Bảng Xếp Hạng */
.pod{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:18px 0 14px}
.pod>div{flex:1;max-width:220px;text-align:center}
.pod .nm{font-weight:800;margin-bottom:4px;word-break:break-word;font-size:clamp(1.05rem,3.6vw,1.25rem);line-height:1.2}
.pod .pt{font-weight:900;font-size:clamp(1.1rem,3.8vw,1.3rem);color:#fff;opacity:.95;margin-bottom:4px}
.pod .bar2{border-radius:14px 14px 0 0;display:flex;align-items:flex-start;justify-content:center;font-size:clamp(2.1rem,6.5vw,2.7rem);padding-top:8px;box-shadow:0 -4px 0 rgba(255,255,255,0.3) inset}
.pod .p1 .bar2{height:130px;background:linear-gradient(#ffd602,#c99a00)}.pod .p2 .bar2{height:96px;background:linear-gradient(#d9dde3,#9aa3ad)}.pod .p3 .bar2{height:70px;background:linear-gradient(#e0975a,#a0602b)}
.pod .me .nm{color:#ffd602;text-shadow:0 0 12px rgba(255,214,2,0.7);font-size:1.3rem}
.pod .me .bar2{outline:3px solid #ffd602;box-shadow:0 0 20px rgba(255,214,2,0.6)}

.row{display:flex;justify-content:space-between;align-items:center;background:#fff;color:#222;border-radius:14px;padding:12px 18px;margin:8px 0;min-height:54px;font-size:1.18rem;font-weight:800;box-shadow:0 4px 10px rgba(0,0,0,0.12);text-shadow:none}

const s = io(), $ = id => document.getElementById(id), app = $('app');
const COL = ['#e21b3c', '#1368ce', '#d89e00', '#26890c'], SYM = ['▲', '◆', '●', '■'];
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let showingGuide = false; // Tránh sự kiện realtime ghi đè giao diện khi đang đọc hướng dẫn
const h = html => { if (!showingGuide) app.innerHTML = html; };
let role = '', timer, cur = null, tok = '', pending = null, pendingName = '', cachedQuizzes = [], cachedSounds = [], curPin = '', curRoomSettings = null;

async function fetchSounds() {
  try {
    const r = await fetch('/api/sounds');
    if (r.ok) cachedSounds = await r.json();
  } catch {}
}

function renderMusicOptions(selectedVal) {
  let html = `<option value="none" ${selectedVal === 'none' ? 'selected' : ''}>🔇 Không nhạc</option>`;
  if (cachedSounds && cachedSounds.length) {
    cachedSounds.forEach(s => {
      if (s.name === 'applause') return;
      const isSel = selectedVal === s.filename || selectedVal === s.name || (selectedVal && selectedVal.replace(/\.\w+$/, '') === s.name);
      html += `<option value="${esc(s.filename)}" ${isSel ? 'selected' : ''}>${esc(s.label || s.filename)}</option>`;
    });
  } else {
    html += `<option value="vui.wav" ${selectedVal === 'vui' || selectedVal === 'vui.wav' ? 'selected' : ''}>🎉 Vui nhộn</option>`;
    html += `<option value="hoihop.wav" ${selectedVal === 'hoihop' || selectedVal === 'hoihop.wav' ? 'selected' : ''}>⏱ Hồi hộp</option>`;
    html += `<option value="thugian.wav" ${selectedVal === 'thugian' || selectedVal === 'thugian.wav' ? 'selected' : ''}>🌿 Thư giãn</option>`;
  }
  html += `<option value="custom" ${selectedVal === 'custom' ? 'selected' : ''}>📁 Tải file nhạc của bạn…</option>`;
  return html;
}

const PK = 'qb_profiles';
let activeProfileId = localStorage.qb_active_prof || '';
function getProfiles() {
  try {
    const d = JSON.parse(localStorage[PK] || '[]');
    return Array.isArray(d) ? d : [];
  } catch { return []; }
}
function putProfiles(arr) {
  try { localStorage[PK] = JSON.stringify(arr); return true; }
  catch (e) { showToast('Không lưu được: bộ nhớ trình duyệt đã đầy. Hãy xoá bớt profile hoặc bỏ ảnh nền/logo.', true); return false; }
}
function renderProfileOptions(selectedId) {
  const profs = getProfiles();
  const opts = [`<option value="">-- Chọn profile đã lưu để áp dụng nhanh --</option>`];
  profs.forEach(p => {
    opts.push(`<option value="${esc(p.id)}" ${p.id === selectedId ? 'selected' : ''}>${esc(p.name)} (${esc(p.quizTitle || 'Quiz')})</option>`);
  });
  return opts.join('');
}
function showToast(msg, isErr = false) {
  const t = document.createElement('div');
  t.style.cssText = `position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:${isErr ? '#e21b3c' : '#26890c'};color:#fff;padding:12px 24px;border-radius:12px;font-weight:800;z-index:99;box-shadow:0 6px 16px #0004;animation:pop .3s ease-out`;
  t.innerHTML = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}
function askInput(title, defaultValue = '') {
  return new Promise(resolve => {
    const d = document.createElement('div');
    d.className = 'mod';
    d.innerHTML = `
      <div class="box" style="max-width:400px;text-align:left;padding:22px;border-radius:18px">
        <h3 style="margin:0 0 10px;color:var(--p);font-family:'Baloo 2',sans-serif;font-size:1.3rem">${esc(title)}</h3>
        <input id="promptVal" value="${esc(defaultValue)}" placeholder="Nhập tên profile..." style="margin-bottom:14px">
        <div style="display:flex;gap:10px">
          <button id="pOk" style="flex:1">Lưu</button>
          <button id="pCancel" class="ghost" style="flex:1;color:#555;border-color:#aaa">Hủy</button>
        </div>
      </div>
    `;
    document.body.appendChild(d);
    const inp = d.querySelector('#promptVal');
    inp.focus(); inp.select();
    const done = val => { d.remove(); resolve(val); };
    d.querySelector('#pOk').onclick = () => done(inp.value.trim());
    d.querySelector('#pCancel').onclick = () => done(null);
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') done(inp.value.trim());
      if (e.key === 'Escape') done(null);
    });
  });
}

// ---- tiện ích form cài đặt: dùng chung cho form tạo phòng (m=false) và hộp sửa phòng (m=true) ----
const num = (v, d, lo, hi) => { const n = parseFloat(v); return Number.isFinite(n) ? Math.min(Math.max(n, lo), hi) : d; };   // số 0 vẫn được giữ đúng là 0
function formVals(m) {
  const g = id => $(m ? 'm_' + id : id);
  const min = num(g('mn') && g('mn').value, 5, 0, 60);
  return {
    quizId: g('qz') ? g('qz').value : '',
    quizTitle: ((g('qz') && g('qz').selectedOptions[0]) || {}).text || 'Quiz',
    auto: g('au') ? g('au').checked : true,
    shuffleQ: g('sq') ? g('sq').checked : false,
    shuffleA: g('sa') ? g('sa').checked : true,
    min,
    wait: Math.max(min, num(g('wt') && g('wt').value, 10, 0, 120)),
    music: g('mu') ? g('mu').value : 'vui.wav',
    vol: num(g('vol') && g('vol').value, 50, 0, 100)
  };
}
function buildProfile(m) {
  const g = id => $(m ? 'm_' + id : id), v = formVals(m);
  return { ...v,
    bgData: (m ? (mBg !== undefined ? mBg : bgData) : bgData) || '',
    logoData: (m ? (mLogo !== undefined ? mLogo : logoData) : logoData) || '',
    brand: { title: g('bt') ? g('bt').value.trim() : '', sub: g('bs') ? g('bs').value.trim() : '', color: g('bc') ? g('bc').value : '#ffd602', style: brandStyle } };
}
// Nhớ lại phần cài đặt của form (bộ câu hỏi, qua câu, thời gian) để mở lại bảng điều khiển vẫn còn nguyên
function saveForm() {
  if (!$('qz')) return;
  const v = formVals(false);
  try { localStorage.qb_form = JSON.stringify({ quizId: v.quizId, auto: v.auto, shuffleQ: v.shuffleQ, shuffleA: v.shuffleA, wait: v.wait, min: v.min }); } catch {}
}
function restoreForm() {
  let f = null; try { f = JSON.parse(localStorage.qb_form || 'null'); } catch {}
  if (!f || !$('qz')) return;
  if ([...$('qz').options].some(o => o.value === String(f.quizId))) $('qz').value = f.quizId;
  $('au').checked = !!f.auto; $('sq').checked = !!f.shuffleQ; $('sa').checked = f.shuffleA !== false;
  $('wt').value = f.wait ?? 10; $('mn').value = f.min ?? 5;
}
function setActive(id) {
  activeProfileId = id || '';
  try { if (id) localStorage.qb_active_prof = id; else localStorage.removeItem('qb_active_prof'); } catch {}
}
function profUI(note) {
  const on = !!activeProfileId;
  if ($('btnUpdateProf')) $('btnUpdateProf').style.display = on ? 'inline-block' : 'none';
  if ($('btnDelProf')) $('btnDelProf').style.display = on ? 'inline-block' : 'none';
  if ($('selProfile')) $('selProfile').innerHTML = renderProfileOptions(activeProfileId);
  if ($('profNote') && note != null) $('profNote').innerHTML = note;
}
const OKT = t => `<span style="color:#26890c;font-weight:700">${t}</span>`;
function onSelectProfile(id) {
  if (!id) { setActive(''); profUI(''); return; }
  const p = getProfiles().find(x => x.id === id);
  if (p) applyProfile(p);
}
function applyProfile(p, quiet) {
  if (!p) return;
  setActive(p.id);
  let quizOk = true;
  if ($('qz')) {
    quizOk = [...$('qz').options].some(o => o.value === String(p.quizId));
    if (quizOk) $('qz').value = p.quizId;
  }
  if ($('au')) $('au').checked = !!p.auto;
  if ($('sq')) $('sq').checked = !!p.shuffleQ;
  if ($('sa')) $('sa').checked = p.shuffleA !== false;
  if ($('wt')) $('wt').value = p.wait ?? 10;
  if ($('mn')) $('mn').value = p.min ?? 5;
  let musicNote = '';
  if ($('mu')) {
    const base = x => String(x || '').replace(/\.\w+$/, '');
    const o = [...$('mu').options].find(o => o.value === p.music || base(o.value) === base(p.music));
    if (o) $('mu').value = o.value;
    else if (p.music) musicNote = p.music === 'custom' ? ' · ⚠ nhạc tự tải lên không lưu trong profile, hãy chọn lại file' : ` · ⚠ nhạc "${esc(p.music)}" không còn trong thư mục, đang giữ nhạc hiện tại`;
    if ($('muf')) $('muf').style.display = $('mu').value === 'custom' ? 'block' : 'none';
  }
  if ($('vol')) $('vol').value = p.vol ?? 50;
  bgData = p.bgData || ''; refreshBg();
  if ($('bt')) $('bt').value = (p.brand && p.brand.title) || '';
  if ($('bs')) $('bs').value = (p.brand && p.brand.sub) || '';
  if ($('bc')) $('bc').value = (p.brand && p.brand.color) || '#ffd602';
  brandStyle = (p.brand && p.brand.style) || null;
  logoData = p.logoData || ''; refreshLogo();
  try {
    localStorage.qb_set = JSON.stringify({ music: $('mu') ? $('mu').value : p.music, vol: p.vol ?? 50 });
    localStorage.qb_brand = JSON.stringify({ title: (p.brand && p.brand.title) || '', sub: (p.brand && p.brand.sub) || '', color: (p.brand && p.brand.color) || '#ffd602', style: brandStyle });
    if (bgData) localStorage.qb_bg = bgData; else localStorage.removeItem('qb_bg');
    if (logoData) localStorage.qb_logo = logoData; else localStorage.removeItem('qb_logo');
  } catch {}
  saveForm();
  const info = `Bộ câu hỏi: ${esc(p.quizTitle || 'Quiz')} · Chờ: ${p.wait ?? 10}s · Tối thiểu: ${p.min ?? 5}s · Nhạc: ${esc(p.music || '')}`;
  if (!quizOk) {
    profUI(`<span style="color:#e21b3c;font-weight:700">⚠ Bộ câu hỏi "${esc(p.quizTitle || '')}" của profile <b>${esc(p.name)}</b> không còn tồn tại.</span> Hãy chọn lại bộ câu hỏi rồi bấm "Cập nhật".${musicNote}`);
    showToast('⚠ Bộ câu hỏi của profile không còn, hãy chọn lại', true);
  } else {
    profUI(OKT(`✔ Đã nạp profile: <b>${esc(p.name)}</b>`) + ' · ' + info + musicNote);
    if (!quiet) showToast(`✔ Đã nạp Profile "${p.name}"! Tất cả cài đặt đã sẵn sàng.`);
  }
}
async function saveAsNewProfile() {
  const n = buildProfile(false);
  if (!n.quizId) return showToast('Chưa có bộ câu hỏi để lưu', true);
  const name = await askInput('Đặt tên cho Profile mới:', n.quizTitle + ' - ' + new Date().toLocaleDateString('vi-VN'));
  if (!name) return;
  const prof = { id: 'prof_' + Date.now(), name, createdAt: Date.now(), ...n };
  if (!putProfiles([prof, ...getProfiles()])) return;          // lưu lỗi thì đã báo, không báo thành công giả
  setActive(prof.id);
  profUI(OKT(`✔ Đã lưu profile mới: <b>${esc(name)}</b>`));
  showToast(`✔ Đã lưu Profile "${name}" thành công!`);
}
async function updateCurrentProfile() {
  if (!activeProfileId) return;
  const profs = getProfiles(), idx = profs.findIndex(p => p.id === activeProfileId);
  if (idx < 0) { setActive(''); profUI('Profile này không còn tồn tại.'); return; }

  profs[idx] = { ...cur, ...n, id: cur.id, name: cur.name, createdAt: cur.createdAt, updatedAt: Date.now() };

      const angle = (Math.PI * 2 / count) * i + (Math.random() - 0.5) * 0.35;
      const speed = Math.random() * 6.8 + (type > 0.4 ? 2.5 : 1.5);
      const isGold = type > 0.7 && Math.random() > 0.35;
      const chosenCol = isGold ? { r: 255, g: 225, b: 90 } : (Math.random() > 0.5 ? baseColor : col2);
      sparks.push({
        x: x,
        y: y,
        prevX: x,
        prevY: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        alpha: 1,
        decay: Math.random() * 0.016 + 0.01,
        color: chosenCol,
        flicker: Math.random() * 10,
        gravity: isGold ? 0.05 : 0.08,
        friction: 0.965,
        size: isGold ? (Math.random() * 2.8 + 1.6) : (Math.random() * 2.2 + 1.2)
      });
    }

    if (isGrand) {
      for (let k = 0; k < 12; k++) {
        const cAngle = Math.random() * Math.PI * 2;
        const cSpeed = Math.random() * 4.5 + 1.5;
        const cCol = colors[Math.floor(Math.random() * colors.length)];
        confetti.push({
          x: x,
          y: y,
          vx: Math.cos(cAngle) * cSpeed,
          vy: Math.sin(cAngle) * cSpeed - 2,
          w: Math.random() * 7 + 5,
          h: Math.random() * 4 + 3,
          rot: Math.random() * 360,
          vrot: (Math.random() - 0.5) * 12,
          color: cCol,
          alpha: 1,
          decay: Math.random() * 0.007 + 0.005,
          sway: Math.random() * 10
        });
      }
    }
  }

  createRocket();
  setTimeout(() => { if (cv.parentNode) createRocket(); }, 120);
  setTimeout(() => { if (cv.parentNode) createRocket(); }, 300);

  function loop(now) {
    if (!cv.parentNode) return;
    
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
    ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';

    if (flash > 0.01) {
      ctx.fillStyle = `rgba(255, 235, 190, ${flash * 0.35})`;
      ctx.fillRect(0, 0, w, h);
      flash *= 0.88;
    }

    if (Date.now() < endTime) {
      const interval = isGrand ? 300 : 450;
      if (now - lastLaunch > interval) {
        createRocket();
        if (isGrand && Math.random() > 0.4) {
          setTimeout(() => { if (cv.parentNode) createRocket(); }, 100);
        }
        lastLaunch = now;
      }
    }

    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.prevX = r.x;
      r.prevY = r.y;
      r.x += r.vx;
      r.y += r.vy;
      r.vy += 0.08;

      ctx.strokeStyle = `rgba(${r.color.r}, ${r.color.g}, ${r.color.b}, 0.9)`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(r.prevX, r.prevY);
      ctx.lineTo(r.x, r.y);
      ctx.stroke();

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(r.x, r.y, 2.8, 0, Math.PI * 2);
      ctx.fill();

      if (r.vy >= -1 || r.y <= r.targetY) {
        explode(r.x, r.y, r.color);
        rockets.splice(i, 1);
      }
    }

    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.prevX = s.x;
      s.prevY = s.y;
      s.x += s.vx;
      s.y += s.vy;
      s.vx *= s.friction;
      s.vy = s.vy * s.friction + s.gravity;
      s.alpha -= s.decay;
      s.flicker += 0.3;

      if (s.alpha <= 0) {
        sparks.splice(i, 1);
        continue;
      }

      const flickAlpha = Math.max(0, Math.min(1, s.alpha * (0.75 + 0.25 * Math.sin(s.flicker))));
      ctx.strokeStyle = `rgba(${s.color.r}, ${s.color.g}, ${s.color.b}, ${flickAlpha})`;
      ctx.lineWidth = s.size;
      ctx.beginPath();
      ctx.moveTo(s.prevX, s.prevY);
      ctx.lineTo(s.x, s.y);
      ctx.stroke();
    }

    ctx.globalCompositeOperation = 'source-over';
    for (let i = confetti.length - 1; i >= 0; i--) {
      const c = confetti[i];
      c.x += c.vx + Math.sin(c.sway += 0.05) * 0.8;
      c.y += c.vy;
      c.vy = Math.min(c.vy + 0.06, 3);
      c.rot += c.vrot;
      c.alpha -= c.decay;

      if (c.alpha <= 0 || c.y > h + 20) {
        confetti.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate((c.rot * Math.PI) / 180);
      ctx.fillStyle = `rgba(${c.color.r}, ${c.color.g}, ${c.color.b}, ${c.alpha})`;
      ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      ctx.restore();
    }

    if (rockets.length || sparks.length || confetti.length || Date.now() < endTime) {
      animId = requestAnimationFrame(loop);
    } else {
      cleanup();
    }
  }

  function cleanup() {
    if (animId) cancelAnimationFrame(animId);
    window.removeEventListener('resize', onResize);
    if (cv.parentNode) cv.remove();
    if (activeFireworksCleanup === cleanup) activeFireworksCleanup = null;
  }

  activeFireworksCleanup = cleanup;
  animId = requestAnimationFrame(loop);
}

  a.href = URL.createObjectURL(new Blob(['\ufeff' + rows.map(r => r.map(e).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = 'ket-qua.csv'; a.click();
}
s.on('closed', why => { localStorage.removeItem('qb'); role = ''; alert(why === 'cancel' ? 'Host đã hủy phòng này' : 'Host đã thoát phòng'); home(); });
let saved = JSON.parse(localStorage.qb || 'null');
if (saved && Date.now() - (saved.t || 0) > 6 * 3600e3) { localStorage.removeItem('qb'); saved = null; }
const qrPin = new URLSearchParams(location.search).get('pin');
if (saved && qrPin && qrPin !== saved.pin) { localStorage.removeItem('qb'); saved = null; }
const savedH = JSON.parse(sessionStorage.qbh || 'null');
if (saved) doJoin(saved.pin, saved.name, saved.token, true);
else if (sessionStorage.qbp && savedH) { tok = sessionStorage.qbp; hostRejoin(savedH, true); }
else if (sessionStorage.qbp) { tok = sessionStorage.qbp; hostMenu(true); }
else home();
