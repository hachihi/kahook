<script>
const s = io(), $ = id => document.getElementById(id), app = $('app');
const COL = ['#e21b3c', '#1368ce', '#d89e00', '#26890c'], SYM = ['▲', '◆', '●', '■'];
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const h = html => { app.classList.remove('fillp'); document.body.classList.remove('pplay'); app.innerHTML = html; };
// Bỏ tiền tố "A. ", "B) " ở đầu đáp án (đáp án bị xáo trộn nên nhãn chữ dễ gây nhầm; đã có ký hiệu hình)
const otx = o => esc(String(o).replace(/^\s*[A-Da-d][\.\):]\s+/, ''));
let role = '', timer, cur = null, tok = '', pending = null, pendingName = '', cachedQuizzes = [], cachedSounds = [], curPin = '', curRoomSettings = null;

async function fetchSounds() {
  try {
    const r = await fetch('/api/sounds');
    if (r.ok) cachedSounds = await r.json();
  } catch {}
}

function renderMusicOptions(selectedVal) {
  let html = `<option value="none" ${selectedVal === 'none' ? 'selected' : ''}>🔇 Không nhạc</option>`;
  if (cachedSounds && cachedSounds.length) {
    cachedSounds.forEach(s => {
      if (s.name === 'applause') return;
      const isSel = selectedVal === s.filename || selectedVal === s.name || (selectedVal && selectedVal.replace(/\.\w+$/, '') === s.name);
      html += `<option value="${esc(s.filename)}" ${isSel ? 'selected' : ''}>${esc(s.label || s.filename)}</option>`;
    });
  } else {
    html += `<option value="vui.wav" ${selectedVal === 'vui' || selectedVal === 'vui.wav' ? 'selected' : ''}>🎉 Vui nhộn</option>`;
    html += `<option value="hoihop.wav" ${selectedVal === 'hoihop' || selectedVal === 'hoihop.wav' ? 'selected' : ''}>⏱ Hồi hộp</option>`;
  }
  html += `<option value="custom" ${selectedVal === 'custom' ? 'selected' : ''}>📁 Tải file nhạc của bạn…</option>`;
  return html;
}

const PK = 'qb_profiles';
let activeProfileId = '';
let profCache = [];
function getProfiles() { return profCache; }
// Đọc profile từ máy host; lần đầu thì chuyển profile cũ trong trình duyệt (nếu có) lên máy host
async function loadProfiles() {
  let arr = null;
  try { const r = await fetch('/api/profiles', { headers: { 'x-token': tok } }); if (r.ok) arr = await r.json(); } catch {}
  if (!Array.isArray(arr)) arr = profCache;
  if (!arr.length) { try { const old = JSON.parse(localStorage[PK] || '[]'); if (Array.isArray(old) && old.length) { arr = old; profCache = arr; await pushProfiles(); } } catch {} }
  profCache = arr;
}
let profSaving = Promise.resolve();
function pushProfiles() {
  profSaving = profSaving.then(async () => {
    try {
      const r = await fetch('/api/profiles', { method: 'PUT', headers: { 'Content-Type': 'application/json', 'x-token': tok }, body: JSON.stringify(profCache) });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).err || r.status);
    } catch (e) { showToast('Không lưu được profile lên máy host: ' + e.message, true); }
  });
  return profSaving;
}
function putProfiles(arr) { profCache = arr; pushProfiles(); return true; }
function renderProfileOptions(selectedId) {
  const profs = getProfiles();
  const opts = [`<option value="">-- Chọn profile đã lưu để áp dụng nhanh --</option>`];
  profs.forEach(p => {
    opts.push(`<option value="${esc(p.id)}" ${p.id === selectedId ? 'selected' : ''}>${esc(p.name)} (${esc(p.quizTitle || 'Quiz')})</option>`);
  });
  return opts.join('');
}
function showToast(msg, isErr = false) {
  const t = document.createElement('div');
  t.style.cssText = `position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:${isErr ? '#e21b3c' : '#26890c'};color:#fff;padding:12px 24px;border-radius:12px;font-weight:800;z-index:99;box-shadow:0 6px 16px #0004;animation:pop .3s ease-out`;
  t.innerHTML = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}
function askInput(title, defaultValue = '') {
  return new Promise(resolve => {
    const d = document.createElement('div');
    d.className = 'mod';
    d.innerHTML = `
      <div class="box" style="max-width:400px;text-align:left;padding:22px;border-radius:18px">
        <h3 style="margin:0 0 10px;color:var(--p);font-family:'Baloo 2',sans-serif;font-size:1.3rem">${esc(title)}</h3>
        <input id="promptVal" value="${esc(defaultValue)}" placeholder="Nhập tên profile..." style="margin-bottom:14px">
        <div style="display:flex;gap:10px">
          <button id="pOk" style="flex:1">Lưu</button>
          <button id="pCancel" class="ghost" style="flex:1;color:#555;border-color:#aaa">Hủy</button>
        </div>
      </div>
    `;
    document.body.appendChild(d);
    const inp = d.querySelector('#promptVal');
    inp.focus(); inp.select();
    const done = val => { d.remove(); resolve(val); };
    d.querySelector('#pOk').onclick = () => done(inp.value.trim());
    d.querySelector('#pCancel').onclick = () => done(null);
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') done(inp.value.trim());
      if (e.key === 'Escape') done(null);
    });
  });
}
function onSelectProfile(id) {
  if (!id) {
    activeProfileId = '';
    if ($('btnUpdateProf')) $('btnUpdateProf').style.display = 'none';
    if ($('btnDelProf')) $('btnDelProf').style.display = 'none';
    if ($('profNote')) $('profNote').textContent = '';
    return;
  }
  const profs = getProfiles();
  const p = profs.find(x => x.id === id);
  if (p) applyProfile(p);
}
function applyProfile(p) {
  if (!p) return;
  activeProfileId = p.id;
  if ($('qz')) {
    for (let opt of $('qz').options) {
      if (opt.value === p.quizId) { $('qz').value = p.quizId; break; }
    }
  }
  if ($('au')) $('au').checked = !!p.auto;
  if ($('sq')) $('sq').checked = !!p.shuffleQ;
  if ($('sa')) $('sa').checked = p.shuffleA !== false;
  if ($('wt')) $('wt').value = p.wait ?? 10;
  if ($('mn')) $('mn').value = p.min ?? 5;
  if ($('mu')) {
    let matched = false;
    for (let opt of $('mu').options) {
      if (opt.value === p.music || opt.value.replace(/\.\w+$/, '') === (p.music || '').replace(/\.\w+$/, '')) {
        $('mu').value = opt.value;
        matched = true;
        break;
      }
    }
    if (!matched && p.music) $('mu').value = p.music;
    if ($('muf')) $('muf').style.display = $('mu').value === 'custom' ? 'block' : 'none';
  }
  if ($('vol')) $('vol').value = p.vol ?? 50;
  bgData = p.bgData || ''; refreshBg();
  if ($('bt')) $('bt').value = (p.brand && p.brand.title) || '';
  if ($('bs')) $('bs').value = (p.brand && p.brand.sub) || '';
  if ($('bc')) $('bc').value = (p.brand && p.brand.color) || '#ffd602';
  brandStyle = (p.brand && p.brand.style) || null;
  logoData = p.logoData || ''; refreshLogo();
  try {
    localStorage.qb_set = JSON.stringify({ music: p.music || 'vui', vol: p.vol ?? 50 });
    localStorage.qb_brand = JSON.stringify(p.brand || {});
    localStorage.qb_bg = bgData;
    localStorage.qb_logo = logoData;
  } catch {}
  if ($('btnUpdateProf')) $('btnUpdateProf').style.display = 'inline-block';
  if ($('btnDelProf')) $('btnDelProf').style.display = 'inline-block';
  if ($('profNote')) {
    $('profNote').innerHTML = `<span style="color:#26890c;font-weight:700">✔ Đã nạp profile: <b>${esc(p.name)}</b></span> · Bộ câu hỏi: ${esc(p.quizTitle || 'Quiz')} · Chờ: ${p.wait}s · Nhạc: ${p.music}`;
  }
  showToast(`✔ Đã nạp Profile "${p.name}"! Tất cả cài đặt đã sẵn sàng.`);
}
async function saveAsNewProfile() {
  const currentTitle = (($('qz') && $('qz').selectedOptions[0]) || {}).text || 'Quiz';
  const defName = currentTitle + ' - ' + new Date().toLocaleDateString('vi-VN');
  const name = await askInput('Đặt tên cho Profile mới:', defName);
  if (!name) return;
  const profs = getProfiles();
  const newProfile = {
    id: 'prof_' + Date.now(),
    name,
    createdAt: Date.now(),
    quizId: $('qz') ? $('qz').value : '',
    quizTitle: currentTitle,
    auto: $('au') ? $('au').checked : true,
    shuffleQ: $('sq') ? $('sq').checked : false,
    shuffleA: $('sa') ? $('sa').checked : true,
    wait: $('wt') ? Number($('wt').value) || 10 : 10,
    min: $('mn') ? Number($('mn').value) || 5 : 5,
    music: $('mu') ? $('mu').value : 'vui',
    vol: $('vol') ? Number($('vol').value) : 50,

async function updateCurrentProfile() {
  if (!activeProfileId) return;
  const profs = getProfiles();
  const idx = profs.findIndex(p => p.id === activeProfileId);
  if (idx < 0) return;
  const current = profs[idx];
  const ok = await ask(`Cập nhật toàn bộ cài đặt hiện tại vào Profile "<b>${esc(current.name)}</b>"?`, 'Cập nhật', 'Hủy');
  if (!ok) return;
  const currentTitle = (($('qz') && $('qz').selectedOptions[0]) || {}).text || current.quizTitle || 'Quiz';
  profs[idx] = {
    ...current,
    quizId: $('qz') ? $('qz').value : current.quizId,
    quizTitle: currentTitle,
    auto: $('au') ? $('au').checked : current.auto,
    shuffleQ: $('sq') ? $('sq').checked : current.shuffleQ,
    shuffleA: $('sa') ? $('sa').checked : current.shuffleA,
    wait: $('wt') ? Number($('wt').value) || 10 : current.wait,
    min: $('mn') ? Number($('mn').value) || 5 : current.min,
    music: $('mu') ? $('mu').value : current.music,
    vol: $('vol') ? Number($('vol').value) : current.vol,
    bgData: bgData || '',
    brand: readBrand(),
    logoData: logoData || '',
    updatedAt: Date.now()
  };
  putProfiles(profs);
  if ($('profNote')) $('profNote').innerHTML = `<span style="color:#26890c;font-weight:700">✔ Đã cập nhật profile: <b>${esc(current.name)}</b></span>`;
  showToast(`✔ Đã cập nhật Profile "${current.name}"!`);
}
async function deleteCurrentProfile() {
  if (!activeProfileId) return;
  const profs = getProfiles();
  const p = profs.find(x => x.id === activeProfileId);
  if (!p) return;
  const ok = await ask(`Bạn có chắc muốn xoá Profile "<b>${esc(p.name)}</b>"?`, 'Xoá Profile', 'Giữ lại');
  if (!ok) return;
  const filtered = profs.filter(x => x.id !== activeProfileId);
  putProfiles(filtered);
  activeProfileId = '';
  if ($('selProfile')) $('selProfile').innerHTML = renderProfileOptions('');
  if ($('btnUpdateProf')) $('btnUpdateProf').style.display = 'none';
  if ($('btnDelProf')) $('btnDelProf').style.display = 'none';
  if ($('profNote')) $('profNote').textContent = 'Đã xoá profile.';
  showToast(`✔ Đã xoá Profile "${p.name}".`);
}
function ensureDefaultProfile(qs) {
  const profs = getProfiles();
  if (profs.length === 0 && qs && qs.length) {
    const firstQ = qs[0];
    const def = {
      id: 'prof_default',
      name: 'Mẫu chuẩn: ' + firstQ.title,
      createdAt: Date.now(),
      quizId: firstQ.id,
      quizTitle: firstQ.title,
      auto: true,
      shuffleQ: false,
      shuffleA: true,
      wait: 10,
      min: 5,
      music: 'vui',
      vol: 50,
      bgData: '',
      brand: { title: '', sub: '', color: '#ffd602' },
      logoData: ''
    };
    profs.push(def);
    putProfiles(profs);
  }
}

function toQuestions(rows) {
  const qs = [], bad = [];
  rows.forEach((r, i) => {
    r = r.map(x => String(x ?? '').trim()); if (!r[0]) return;
    const o = r.slice(1, 5); while (o.length && !o[o.length - 1]) o.pop();
    const raw = (r[5] || '').toLowerCase(); let c = -1;
    if (/^[a-d]$/.test(raw)) c = 'abcd'.indexOf(raw); else if (/^[1-4]$/.test(raw)) c = +raw - 1; else c = o.findIndex(x => x.toLowerCase() === raw);
    if (o.length < 2 || c < 0 || c >= o.length || !o[c]) { if (i > 0) bad.push(i + 1); return; }
    const t = Number(r[6]); qs.push({ q: r[0], options: o, correct: c, time: t >= 5 && t <= 120 ? Math.round(t) : 20 });
  });
  return { qs, bad };
}
function showPending(rows, name) {
  const { qs, bad } = toQuestions(rows);
  if (!qs.length) { $('pv').innerHTML = ''; return $('err').textContent = 'Không đọc được câu hỏi nào. Kiểm tra lại định dạng cột.'; }
  pending = qs; $('err').textContent = '';
  $('pv').innerHTML = `<div class="big" style="font-size:1.1rem">Đọc được ${qs.length} câu${bad.length ? ` — bỏ qua ${bad.length} dòng lỗi (dòng ${bad.slice(0, 8).join(', ')}${bad.length > 8 ? '…' : ''}), hãy kiểm tra cột F` : ''}. Câu đầu: ${esc(qs[0].q)}</div>
  <input id="tt" placeholder="Tên bộ câu hỏi" value="${esc(name)}"><button onclick="save()">Lưu bộ câu hỏi</button>`;
}

    { r: 140, g: 60,  b: 255 }, // royal purple

    const targetY = Math.random() * (h * 0.45) + (h * 0.08);

  h(`<div class="pres"><div class="panel ${r.correct ? 'ok' : 'bad'}"><h1>${r.answered ? (r.correct ? 'ĐÚNG! 🎉' : 'SAI 😅') : 'Hết giờ ⏰'}</h1>
  ${leaderBadge}
  <div class="big">+${r.gained} điểm</div>${r.correct ? '' : `<div>Đáp án đúng: <b>${otx(r.correctText)}</b></div>`}</div>
  <div class="big" style="${isLeader ? 'color:#ffd602;text-shadow:0 0 10px #ffd60288' : ''}">Tổng ${r.score} điểm · Hạng ${r.rank}/${r.total}</div><div id="pn" class="big" style="color:#ffd602"></div>
  <h2>Bảng xếp hạng</h2>${board(r.top, r.name)}</div>`);
  const left0 = r.left, t0 = Date.now(), lab = r.last ? 'Kết quả cuối cùng sau' : 'Câu tiếp theo sau';
  const tk = () => { if (!$('pn')) return clearInterval(timer); $('pn').textContent = left0 == null ? 'Chờ host chuyển câu…' : `${lab} ${Math.max(Math.ceil(left0 - (Date.now() - t0) / 1000), 0)}s`; };
  tk(); timer = setInterval(tk, 500);
});
s.on('saveStatus', d => { const e = $('sv'); if (e) { e.style.color = d.ok ? '#9f9' : '#ffd602'; e.textContent = d.ok ? '✔ Đã lưu kết quả vào máy host' : `⚠ Chưa lưu được kết quả (${d.msg}). Kết quả vẫn có trong trình duyệt.`; } });
let lastEnd = null;
function showEnd(d, saved, meta) {
  h(`<h1>🏆 Kết quả</h1>${meta ? `<div>${esc(meta.title)} · ${esc(meta.date)}</div>` : ''}${board(d.full || d.top)}${d.full && !saved ? '<div id="sl" class="er"></div><div id="sv" class="er"></div>' : ''}` +
    (d.full ? `<button onclick="csv()">⬇ Tải bảng điểm (CSV)</button><button class="ghost" onclick="leaveEnd(${saved})">Về trang host</button>` : `<button onclick="location.reload()">Chơi lại</button>`));
}
async function leaveEnd(saved) {
  if (saved || await ask('Rời khỏi trang kết quả?<br><small>Kết quả đã được lưu trong trình duyệt. Xem lại ở mục "Kết quả đã lưu" trên trang host.</small>', 'Có, rời đi', 'Không, ở lại')) hostMenu();
}
s.on('end', d => {
  clearInterval(timer); lastEnd = d; localStorage.removeItem('qb'); gameActive = false; stopMusic();
  const okLocal = d.full ? saveRes(d) : true;
  showEnd(d, false); fireworks(12000, true); applause();
  if (!okLocal && $('sl')) $('sl').textContent = '⚠ Không lưu được vào trình duyệt (bộ nhớ đầy?). Hãy tải CSV ngay!';
});
function csv() {
  const d = lastEnd, e = v => { v = String(v); if (/^[=+\-@]/.test(v)) v = "'" + v; return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const rows = [['Hạng', 'Tên', 'Tổng điểm', 'Số câu đúng', ...d.qs.map((q, i) => `Câu ${i + 1}: ${q.slice(0, 40)}`)],
    ...d.full.map((p, i) => [i + 1, p.name, p.score, p.correct, ...p.log])];
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + rows.map(r => r.map(e).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = 'ket-qua.csv'; a.click();
}
s.on('closed', () => { localStorage.removeItem('qb'); role = ''; alert('Host đã thoát phòng'); home(); });
let saved = JSON.parse(localStorage.qb || 'null');
if (saved && Date.now() - (saved.t || 0) > 6 * 3600e3) { localStorage.removeItem('qb'); saved = null; }
const qrPin = new URLSearchParams(location.search).get('pin');
if (saved && qrPin && qrPin !== saved.pin) { localStorage.removeItem('qb'); saved = null; }
const savedH = JSON.parse(sessionStorage.qbh || 'null');
if (saved) doJoin(saved.pin, saved.name, saved.token, true);
else if (sessionStorage.qbp && savedH) { tok = sessionStorage.qbp; hostRejoin(savedH, true); }
else if (sessionStorage.qbp) { tok = sessionStorage.qbp; hostMenu(true); }
else home();
</script></body></html>
